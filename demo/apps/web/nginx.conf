# Một origin cho cả app: web, /api, và hai đường IdP giả lập cần trình duyệt đi qua.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location /auth/callback { proxy_pass http://api:3000; proxy_set_header Host $http_host; }
  location /dev-mock-idp/ { proxy_pass http://api:3000; proxy_set_header Host $http_host; }

  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
